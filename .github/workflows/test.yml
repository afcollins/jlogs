name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  issue_comment:
    types: [created]

# Permessi minimi necessari: lettura del codice + scrittura sulle issue/PR
# per poter aggiungere la reaction al commento.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    # Esegui su eventi PR, push, o quando un utente AUTORIZZATO commenta /test su una PR
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/test') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      - name: React to comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            })

      - name: Checkout PR code
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Checkout code
        if: github.event_name != 'issue_comment'
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        run: go test ./...

      - name: Report status to PR
        if: always() && (github.event_name == 'issue_comment' || github.event_name == 'pull_request')
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ job.status }}' === 'success'
              ? '✅ Tests passed'
              : '❌ Tests failed';

            const prNumber = context.issue.number || context.payload.pull_request.number;

            const trigger = context.eventName === 'issue_comment'
              ? 'Triggered by `/test` command'
              : 'Triggered by pull request';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `${conclusion}\n\n${trigger}\n\n[View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            });
